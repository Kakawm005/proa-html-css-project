<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Links Favoritos</title>
</head>

<body>

    <h1>Meus Links Favoritos</h1>

    <p>Sites úteis para quem está estudando tecnologia:</p>

    <ul>

        <!-- Link para o W3Schools -->
        <li>
            <a 
                href="https://www.w3schools.com/"
                title="Aprenda HTML, CSS, JavaScript e outras tecnologias"
                target="_blank"
                rel="noopener noreferrer">
                W3Schools
            </a>
        </li>

        <!-- Link para o MDN -->
        <li>
            <a 
                href="https://developer.mozilla.org/"
                title="Documentação de tecnologias da Web"
                target="_blank"
                rel="noopener noreferrer">
                MDN Web Docs
            </a>
        </li>

        <!-- Link para o GitHub -->
        <li>
            <a 
                href="https://github.com/"
                title="Plataforma para hospedar projetos e códigos">
                GitHub
            </a>
        </li>

        <!-- Link para o Stack Overflow -->
        <li>
            <a 
                href="https://stackoverflow.com/"
                title="Comunidade para tirar dúvidas de programação">
                Stack Overflow
            </a>
        </li>

        <!-- Link para o Python -->
        <li>
            <a 
                href="https://www.python.org/"
                title="Site oficial da linguagem Python">
                Python
            </a>
        </li>

    </ul>

    <h2>Link utilizando uma imagem</h2>

    <!--
        O elemento <a> envolve a imagem.
        Dessa forma, ao clicar na imagem, o usuário será
        direcionado para o site do W3Schools.
    -->
    <a 
        href="https://www.w3schools.com/"
        title="Clique para acessar o W3Schools"
        target="_blank"
        rel="noopener noreferrer">

        <img 
            src="https://www.w3schools.com/images/w3schools_logo_436_2.png"
            alt="Logo do W3Schools"
            width="200">
    </a>

</body>

</html>
