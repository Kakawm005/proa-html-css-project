<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Trabalhando com Atributos HTML</title>
</head>

<body>

    <h1 title="Título principal da página">
        Minha Página com Atributos HTML
    </h1>

    <!--
        O atributo href define o endereço para onde o link irá
        quando o usuário clicar nele.
    -->
    <a href="https://www.google.com">
        Acessar o Google
    </a>

    <br><br>

    <!--
        O atributo src define o caminho ou endereço da imagem
        que será exibida pelo elemento <img>.
        
        O atributo alt fornece um texto alternativo para a imagem,
        importante para acessibilidade e caso a imagem não carregue.
        
        O atributo width define a largura da imagem em pixels.
        
        O atributo height define a altura da imagem em pixels.
        
        O atributo title exibe uma pequena mensagem quando o
        usuário passa o mouse sobre a imagem.
    -->
    <img
        src="images.jfif"
        alt="Imagem de exemplo"
        width="400"
        height="200"
        title="Esta é uma imagem de exemplo"
    >

    <br><br>

    <!--
        O atributo lang="pt-BR" informa ao navegador que o idioma
        principal do documento é português do Brasil.
    -->
    <p lang="pt-BR">
        Esta página foi criada para demonstrar diferentes
        atributos HTML.
    </p>

</body>
</html>
