<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- Define o título que será exibido na aba do navegador -->
    <title>Minha Página HTML</title>
</head>

<body>

    <!-- ==================== CABEÇALHO ==================== -->
    <!-- O cabeçalho contém o nome do site e o menu de navegação -->
    <header>
        <h1>Meu Site</h1>

        <!-- Menu principal de navegação -->
        <nav>
            <a href="#">Início</a>
            <a href="#">Sobre</a>
            <a href="#">Contato</a>
        </nav>
    </header>

    <!-- ==================== CONTEÚDO PRINCIPAL ==================== -->
    <!-- Esta seção apresenta o conteúdo principal da página -->
    <main>
        <h2>Bem-vindo ao meu site!</h2>

        <p>
            Esta é uma página criada para praticar comentários em HTML
            e organizar melhor o código.
        </p>

        <!-- Decisão de código: usamos uma seção main porque ela representa
             o conteúdo principal e mais importante desta página. -->
        <section>
            <h3>Sobre o projeto</h3>
            <p>
                O objetivo deste projeto é aprender a documentar
                corretamente um arquivo HTML.
            </p>
        </section>

        <!-- Elemento comentado temporariamente para não aparecer no navegador -->
        <!--
        <p>Este texto está temporariamente desativado.</p>
        -->

    </main>

    <!-- ==================== RODAPÉ ==================== -->
    <!-- O rodapé contém informações adicionais sobre a página -->
    <footer>
        <!-- Informação de direitos autorais -->
        <p>&copy; 2026 - Meu Site. Todos os direitos reservados.</p>
    </footer>

</body>
</html>
